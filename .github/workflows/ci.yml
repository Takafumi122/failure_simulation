name: FailureLab CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend-and-frontend:
    name: Go Tests (Race/Vet) & Frontend E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: backend/go.sum

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Run Go Vet
        working-directory: backend
        run: go vet ./...

      - name: Run Go Unit & Integration Tests with Race Detector
        working-directory: backend
        run: go test -v -race ./...

      - name: Build Go Server Binary
        working-directory: backend
        run: go build -o failurelab-server ./cmd/server

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend TypeScript & Vite Bundle
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Browser E2E Suite
        working-directory: frontend
        run: npm run test:e2e
